<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>영상 아카이브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; touch-action: pan-y; margin:0; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    letter-spacing: -0.02em;
    background:#fafafa; color:#1a1a1a;
    padding-bottom: 60px;
  }
  input, textarea, button { font-family: inherit; letter-spacing: inherit; }
  input, textarea { font-size:16px; }

  header {
    position: sticky; top:0; background:#fafafa; z-index:10;
    padding:16px; border-bottom:1px solid #eee;
  }
  .topbar { display:flex; gap:8px; max-width:900px; margin:0 auto; }
  #searchInput {
    flex:1; padding:12px 14px; border:1px solid #ddd; border-radius:10px;
    font-size:16px; outline:none;
  }
  #searchInput:focus { border-color:#333; }
  .btn {
    padding:12px 16px; border:none; border-radius:10px; background:#1a1a1a; color:#fff;
    cursor:pointer; font-size:14px; white-space:nowrap;
  }
  .btn.secondary { background:#fff; color:#1a1a1a; border:1px solid #ddd; }
  .btn:disabled { opacity:.4; cursor:default; }

  #selectBar {
    display:none; max-width:900px; margin:8px auto 0; gap:8px; align-items:center; flex-wrap:wrap;
    padding:0 16px;
  }
  #selectBar.active { display:flex; }
  #selectBar span { font-size:13px; color:#666; }

  main { max-width:900px; margin:0 auto; padding:16px; }
  .grid {
    display:grid; grid-template-columns: repeat(3, 1fr); gap:14px;
  }
  @media (max-width:640px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap:10px; }
  }
  .card {
    cursor:pointer; position:relative; background:#fff; border-radius:10px; overflow:hidden;
    border:1px solid #eee;
  }
  .card img { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#eee; }
  .card .fn { font-size:12px; padding:6px 8px; color:#444; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .chk {
    position:absolute; top:6px; left:6px; width:20px; height:20px; border-radius:50%;
    border:2px solid #fff; background:rgba(0,0,0,.25);
  }
  .card .chk.on { background:#1a1a1a; }
  .star {
    position:absolute; top:6px; right:6px; border:none; background:rgba(0,0,0,.35); color:#fff;
    width:26px; height:26px; border-radius:50%; font-size:15px; cursor:pointer; line-height:1;
  }
  .kwTag { display:inline-flex; align-items:center; gap:4px; background:#f0f0f0; border-radius:14px; padding:4px 10px; margin:3px; font-size:12px; }
  .kwTag button { border:none; background:none; cursor:pointer; font-size:12px; color:#999; }
  /* 영상 카드/썸네일: 기본 long press(이미지 저장 등) 방지 — 카드 영역에만 적용 */
  .card, .card * { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  .card { touch-action:pan-y; }
  .card img { pointer-events:none; -webkit-user-drag:none; user-drag:none; }
  .card .chk { display:none; }
  .grid.selecting .card .chk { display:block; }
  .card .chk.on { display:block; }
  .grid:not(.selecting) .card .chk.on { display:none; }
  .card .chk.on::after { content:"✓"; color:#fff; font-size:13px; line-height:16px; display:block; text-align:center; }
  .card.sel { outline:3px solid #1a1a1a; outline-offset:-3px; }
  .card.sel::before { content:""; position:absolute; inset:0; background:rgba(0,0,0,.18); z-index:1; pointer-events:none; }
  .card.sel .chk, .card.sel .star { z-index:2; }
  .card.anchor { outline:3px solid #2d6cdf; outline-offset:-3px; }
  #filterBar { display:flex; max-width:900px; margin:8px auto 0; gap:10px; align-items:center; flex-wrap:wrap; }
  #noKwBtn { padding:10px 14px; }
  #noKwBtn.on { background:#1a1a1a; color:#fff; border-color:#1a1a1a; font-weight:600; }
  #filterInfo { font-size:13px; color:#666; }
  #selHint { flex-basis:100%; font-size:12px; color:#2d6cdf; }
  .empty { text-align:center; color:#999; padding:60px 0; font-size:14px; }

  .overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100;
    align-items:center; justify-content:center; padding:16px;
  }
  .overlay.show { display:flex; }
  .sheet {
    background:#fff; border-radius:14px; width:100%; max-width:480px; max-height:88vh;
    overflow-y:auto; padding:20px;
  }
  .sheet h3 { margin:0 0 14px; font-size:16px; }
  .sheet .close { float:right; background:none; border:none; font-size:18px; cursor:pointer; }
  .sheet textarea { width:100%; min-height:80px; padding:10px; border:1px solid #ddd; border-radius:8px; resize:vertical; }
  .sheet .row { margin-bottom:14px; }
  .bundleChip {
    display:inline-block; padding:6px 12px; margin:3px; border-radius:16px; background:#f0f0f0;
    font-size:13px; cursor:pointer; border:1px solid #ddd;
  }

  #detailImg { width:100%; border-radius:10px; margin-bottom:14px; background:#eee; }
  #detailFn { font-size:14px; word-break:break-all; margin-bottom:16px; color:#333; }

  .fileRow { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:4px 0; border-bottom:1px solid #f2f2f2; }
  .fileRow .st { font-size:11px; padding:2px 6px; border-radius:6px; }
  .st.pending { background:#eee; color:#666; }
  .st.uploading { background:#fff3cd; color:#946c00; }
  .st.success { background:#d4edda; color:#1c6b31; }
  .st.fail { background:#f8d7da; color:#a31c2b; }
  .st.dup { background:#e2e3e5; color:#555; }
  .st.paused { background:#e7e3f7; color:#4b3a9a; }
  .st.needfile { background:#fde8d0; color:#8a4b00; }
  .fileRow .nm { min-width:0; flex:1; padding-right:8px; word-break:break-all; }
  .fileRow .er { color:#a31c2b; font-size:11px; }
  .fileRow .st { white-space:nowrap; }
  #progressText, #uploadNotice { white-space:pre-line; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1a1a1a; color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; z-index:200; display:none; max-width:90%; text-align:center; }
  #fileList { max-height:220px; overflow-y:auto; margin-top:8px; }
  #progressWrap { background:#eee; border-radius:6px; overflow:hidden; height:8px; margin-top:10px; }
  #progressBar { background:#1a1a1a; height:100%; width:0%; transition:width .2s; }
  #statusBar { display:none; width:100%; max-width:900px; margin:8px auto 0; padding:6px 12px; border:1px solid #ddd; border-radius:10px; background:#fff; font-size:12px; text-align:left; cursor:pointer; }
  #statusBar.err { color:#a31c2b; border-color:#f0c4c9; }
  .topbar > * { min-width:0; }
  #statusBar { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet { min-width:0; overflow-x:hidden; }
  .sheet .row, .sheet .row > * { max-width:100%; }
  .mHint { display:none; }

  @media (max-width:640px) {
    html, body { width:100%; max-width:100%; overflow-x:hidden; }
    body { padding-bottom:140px; }
    header { padding:10px 12px; width:100%; max-width:100%; }
    .topbar { flex-wrap:wrap; width:100%; max-width:100%; gap:8px; }
    #searchInput { flex:1 1 100%; width:100%; min-width:0; }
    .topbar .btn { flex:1 1 0; min-width:0; padding:11px 8px; white-space:normal; line-height:1.2; }
    #favFilterBtn { flex:0 0 52px; }
    #filterBar { width:100%; max-width:100%; gap:8px; }
    #noKwBtn { flex:1 1 auto; white-space:normal; }
    #filterInfo { flex-basis:100%; }
    main { padding:12px; width:100%; max-width:100%; }
    .btn { white-space:normal; }
    .overlay { padding:10px; }
    .sheet { max-width:100%; padding:16px; }
    #selectBar {
      position:fixed; left:0; right:0; bottom:0; margin:0; width:100%; max-width:100%;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
      background:#fff; border-top:1px solid #ddd; box-shadow:0 -2px 10px rgba(0,0,0,.08);
      z-index:50; gap:8px; flex-wrap:wrap;
    }
    #selectBar .btn { flex:1 1 0; min-width:0; padding:11px 8px; }
    #selCount { flex-basis:100%; font-size:14px; font-weight:600; color:#1a1a1a; }
    #selHint { order:5; }
    .pcHint { display:none; }
    .mHint { display:inline; }
    #toast { bottom:150px; }
  }
</style>
</head>
<body>

<header>
  <div class="topbar">
    <input id="searchInput" placeholder="자연어로 검색 (예: 공항에서 캐리어 끌던 윤호)">
    <button class="btn secondary" id="favFilterBtn">☆</button>
    <button class="btn secondary" id="selectModeBtn">선택</button>
    <button class="btn" id="uploadOpenBtn">업로드 관리</button>
  </div>
  <div id="filterBar">
    <button class="btn secondary" id="noKwBtn" aria-pressed="false">검색어 없는 것만</button>
    <span id="filterInfo"></span>
  </div>
  <button id="statusBar"></button>
  <div id="selectBar">
    <span id="selCount">0개 선택</span>
    <button class="btn secondary" id="applyKwBtn">검색어 적용</button>
    <button class="btn secondary" id="cancelSelBtn">취소</button>
    <span id="selHint"><span class="pcHint">첫 카드 클릭 → Shift+마지막 카드 클릭으로 범위 선택</span><span class="mHint">첫 카드 길게 누르기 → 마지막 카드 탭</span></span>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">결과가 없습니다</div>
</main>

<!-- 상세 모달 -->
<div class="overlay" id="detailOverlay">
  <div class="sheet">
    <button class="close" id="detailClose">✕</button>
    <img id="detailImg">
    <div id="detailFn"></div>
    <button class="btn secondary" id="favBtn" style="width:100%;margin-bottom:8px;">☆ 즐겨찾기</button>
    <button class="btn" id="downloadBtn" style="width:100%;">원본 저장</button>

    <div class="row" style="margin-top:16px;">
      <div style="font-size:12px;color:#999;margin-bottom:4px;">검색어</div>
      <div id="detailKwTags"></div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <input id="detailKwAdd" placeholder="검색어 추가" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;">
        <button class="btn secondary" id="detailKwAddBtn">추가</button>
      </div>
    </div>
    <div class="row">
      <div style="font-size:12px;color:#999;margin-bottom:4px;">인물</div>
      <div id="detailPeopleTags"></div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <input id="detailPeopleAdd" placeholder="인물 추가" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;">
        <button class="btn secondary" id="detailPeopleAddBtn">추가</button>
      </div>
    </div>
    <div class="row">
      <div style="font-size:12px;color:#999;margin-bottom:4px;">조합</div>
      <div id="detailPairsTags"></div>
      <div style="display:flex;gap:6px;margin-top:6px;">
        <input id="detailPairsAdd" placeholder="조합 추가 (예: A+B)" style="flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;">
        <button class="btn secondary" id="detailPairsAddBtn">추가</button>
      </div>
    </div>
    <button class="btn secondary" id="deleteBtn" style="width:100%;margin-top:10px;color:#a31c2b;">영상 삭제</button>
  </div>
</div>

<!-- 업로드 모달 -->
<div class="overlay" id="uploadOverlay">
  <div class="sheet">
    <button class="close" id="uploadClose">✕</button>
    <h3>업로드 관리</h3>
    <div id="countBox"></div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="progressText" style="font-size:12px;color:#666;margin-top:6px;"></div>
    <div class="row">
      <input type="file" id="fileInput" multiple accept="video/*" style="display:none;">
      <input type="file" id="folderInput" webkitdirectory multiple style="display:none;">
      <button class="btn secondary" id="pickFilesBtn">파일 선택</button>
      <button class="btn secondary" id="pickFolderBtn">폴더 선택</button>
    </div>
    <div class="row">
      <textarea id="uploadKwInput" placeholder="검색어 (쉼표 또는 줄바꿈, 선택 사항)"></textarea>
    </div>
    <button class="btn" id="startUploadBtn" style="width:100%;">업로드 시작</button>
    <div style="display:flex;gap:6px;margin-top:6px;">
      <button class="btn secondary" id="pauseBtn" style="flex:1;padding:10px 6px;">일시정지</button>
      <button class="btn secondary" id="resumeBtn" style="flex:1;padding:10px 6px;">재개</button>
      <button class="btn secondary" id="stopAllBtn" style="flex:1;padding:10px 6px;">전체 중지</button>
    </div>
    <button class="btn secondary" id="retryFailBtn" style="width:100%;margin-top:6px;display:none;">실패한 파일만 재시도</button>
    <button class="btn secondary" id="reconnectBtn" style="width:100%;margin-top:6px;display:none;">이전에 선택한 파일 다시 연결</button>
    <div id="uploadNotice" style="font-size:12px;color:#8a4b00;margin-top:8px;"></div>
    <div id="diagText" style="font-size:11px;color:#888;margin-top:4px;word-break:break-all;"></div>
    <div id="fileList"></div>
  </div>
</div>

<div id="toast"></div>

<!-- 파일명 중복 선택 -->
<div class="overlay" id="dupOverlay" style="z-index:150"><div class="sheet"><h3 id="dupTitle"></h3><div id="dupBody"></div></div></div>

<!-- 검색어 적용 모달 -->
<div class="overlay" id="kwOverlay">
  <div class="sheet">
    <button class="close" id="kwClose">✕</button>
    <h3>일괄 적용 (<span id="kwTargetCount">0</span>개 영상)</h3>
    <div class="row">
      <label><input type="radio" name="kwField" value="keywords" checked> 검색어</label>
      <label><input type="radio" name="kwField" value="people"> 인물</label>
      <label><input type="radio" name="kwField" value="pairs"> 조합</label>
    </div>
    <div class="row">
      <textarea id="kwInput" placeholder="쉼표 또는 줄바꿈으로 입력 (조합 예: A+B)"></textarea>
    </div>
    <div class="row">
      <label><input type="radio" name="kwMode" value="add" checked> 기존에 추가</label>
      <label><input type="radio" name="kwMode" value="overwrite"> 덮어쓰기</label>
      <label><input type="radio" name="kwMode" value="remove"> 삭제</label>
    </div>
    <div class="row" id="bundleList"></div>
    <div class="row">
      <input id="bundleNameInput" placeholder="현재 검색어를 묶음으로 저장할 이름" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:8px;">
      <button class="btn secondary" id="saveBundleBtn" style="margin-top:6px;">묶음 저장</button>
    </div>
    <button class="btn" id="kwApplyBtn" style="width:100%;">적용</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, getDocs, addDoc, updateDoc, setDoc, deleteDoc, doc,
  serverTimestamp, query, orderBy, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBtovIReWBTVBifTFdDzSV5pqAvYtgiaM8",
  authDomain: "etidclip.firebaseapp.com",
  projectId: "etidclip",
  storageBucket: "etidclip.firebasestorage.app",
  messagingSenderId: "1059739626015",
  appId: "1:1059739626015:web:44313cffbc7b39b4e9c32a"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const CLOUD_NAME = "qm0m5g4o";
const UPLOAD_PRESET = "editclip"; // Unsigned preset (secret 미사용)

async function sha1Hex(str) {
  const buf = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function sha256Hex(buf) {
  const h = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("");
}

let videos = [];      // {id, filename, cloudinaryUrl, thumbnailUrl, cloudinaryPublicId, keywords, people, pairs, favorite, fileHash}
let filenameSet = new Set();
let hashSet = new Set();
let bundles = [];
let selectMode = false;
let selected = new Set();
let favOnly = false;
let noKwOnly = false;

const $ = (id) => document.getElementById(id);

function thumbUrl(publicId, ver) {
  return `https://res.cloudinary.com/${CLOUD_NAME}/video/upload/w_400,h_400,c_fill,so_0/${ver ? "v" + ver + "/" : ""}${publicId}.jpg`;
}

async function loadVideos() {
  const snap = await getDocs(query(collection(db, "videos"), orderBy("createdAt", "desc")));
  videos = snap.docs.map(d => {
    const v = d.data();
    return {
      id: d.id, ...v,
      people: v.people || [], pairs: v.pairs || [],
      favorite: v.favorite || false, fileHash: v.fileHash || null
    };
  });
  filenameSet = new Set(videos.map(v => v.filename));
  hashSet = new Set(videos.map(v => v.fileHash).filter(Boolean));
  rebuildHashIndex();
  render();
}

async function loadBundles() {
  const snap = await getDocs(collection(db, "bundles"));
  bundles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function ellipsize(name) {
  if (name.length <= 22) return name;
  return name.slice(0, 10) + "..." + name.slice(-9);
}

function tokenize(q) {
  return q.split(/[\s,]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
}

function search(q) {
  if (!q.trim()) return videos;
  const tokens = tokenize(q);
  const scored = videos.map(v => {
    const kws = [...(v.keywords || []), ...(v.people || []), ...(v.pairs || [])].map(k => k.toLowerCase());
    const fn = v.filename.toLowerCase();
    let score = 0;
    tokens.forEach(t => {
      if (kws.some(k => k.includes(t) || t.includes(k))) score += 2;
      if (fn.includes(t)) score += 1;
    });
    return { v, score };
  }).filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.map(x => x.v);
}

// 「검색어 없음」 판단은 오직 keywords 기준 (people/pairs/favorite/filename 무관)
function hasKeywords(v) {
  return Array.isArray(v.keywords) && v.keywords.some(k => String(k ?? "").trim().length > 0);
}

let visibleList = [];          // 현재 화면에 표시 중인 영상 (범위 선택 기준)
let cardEls = new Map();       // id -> 카드 요소 (선택 표시만 부분 갱신)
let rangeAnchorId = null;      // 범위 선택 시작점
let pendingRange = false;      // 모바일: 길게 눌러 시작점이 지정된 상태
let suppressClick = false;
let pruneNext = false;

function render() {
  const q = $("searchInput").value;
  let list = search(q);
  if (favOnly) list = list.filter(v => v.favorite);
  if (noKwOnly) list = list.filter(v => !hasKeywords(v));
  visibleList = list;
  if (pruneNext) { // 필터를 바꿨을 때 화면에서 사라진 영상이 선택에 남아 있지 않도록 정리
    pruneNext = false;
    const vis = new Set(list.map(v => v.id));
    [...selected].forEach(id => { if (!vis.has(id)) selected.delete(id); });
    if (rangeAnchorId && !vis.has(rangeAnchorId)) { rangeAnchorId = null; pendingRange = false; }
    updateSelBar();
  }
  cardEls = new Map();
  const frag = document.createDocumentFragment();
  list.forEach(v => {
    const card = document.createElement("div");
    card.className = "card" + (selectMode && selected.has(v.id) ? " sel" : "") + (selectMode && v.id === rangeAnchorId ? " anchor" : "");
    card.draggable = false;
    card.innerHTML = `
      <img loading="lazy" src="${v.thumbnailUrl}" alt="" draggable="false">
      <button class="star" data-id="${v.id}">${v.favorite ? "★" : "☆"}</button>
      <div class="fn">${ellipsize(v.filename)}</div>
      <div class="chk ${selected.has(v.id) ? 'on' : ''}"></div>
    `;
    card.querySelector(".star").onclick = (e) => { e.stopPropagation(); toggleFavorite(v); };
    card.onclick = (e) => onCardClick(v, e);
    attachLongPress(card, v);
    cardEls.set(v.id, card);
    frag.appendChild(card);
  });
  $("grid").classList.toggle("selecting", selectMode);
  $("grid").replaceChildren(frag);
  const empty = $("emptyMsg");

const LONG_PRESS_MS = 550;
const MOVE_THRESHOLD = 10;
function attachLongPress(card, v) {
  let timer = null, sx = 0, sy = 0, active = false, fired = false;
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } active = false; };
  const trigger = () => {
    if (!active || fired) return;
    timer = null; fired = true; suppressClick = true;      // 뒤따르는 click(상세 모달) 무시
    if (!selectMode) { selectMode = true; selected.clear(); }
    $("grid").classList.add("selecting");
    setSelected(v.id, true);
    rangeAnchorId = v.id; pendingRange = true;
    markAnchor(); updateSelBar();
    if (navigator.vibrate) navigator.vibrate(30);
    toast("시작점 지정됨 — 마지막 영상을 탭하세요");
  };
  card.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" || !e.isPrimary) return;  // PC 마우스는 기존 Shift 범위 선택 사용
    if (e.target.closest && e.target.closest(".star")) return;
    fired = false; active = true; sx = e.clientX; sy = e.clientY;
    if (timer) clearTimeout(timer);
    timer = setTimeout(trigger, LONG_PRESS_MS);
  });
  card.addEventListener("pointermove", (e) => {
    if (!active || fired) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > MOVE_THRESHOLD) cancel();  // 스크롤/이동 → 취소
  });
  const end = () => {
    const was = fired;
    cancel(); fired = false;
    if (was) setTimeout(() => { suppressClick = false; }, 400);
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("pointerleave", (e) => { if (e.pointerType !== "mouse" && !fired) cancel(); });
  // 브라우저 기본 메뉴(이미지 저장/공유 등) 차단 — 카드 영역에만 적용.
  // 일부 안드로이드 브라우저는 550ms 전에 contextmenu를 먼저 보내므로, 그때 long press로 처리한다.
  card.addEventListener("contextmenu", (e) => { e.preventDefault(); if (active && !fired) trigger(); });
  card.addEventListener("dragstart", (e) => e.preventDefault());
}

// 구조: Firestore `uploadJobs` 컬렉션에 파일별 작업 상태를 저장(pending/uploading/completed/failed/paused).
// 실행 중인 JS는 페이지가 닫히면 종료된다. 백그라운드 업로드는 하지 않고, 앱을 다시 열면 남은 작업을 이어받는다.

const FULL_HASH_LIMIT = 50 * 1024 * 1024; // 이 크기 이하는 전체 SHA-256, 초과는 표본 해시
const UPLOAD_TIMEOUT_MS = 30 * 60 * 1000;
const MAX_AUTO_RETRY = 2;           // 네트워크 오류/429/5xx 자동 재시도 횟수

const VIDEO_RE = /\.(mp4|mov|avi|mkv|webm|m4v)$/i;
const stat = (o) => o.status === "completed" && o.duplicate ? "duplicate" : o.status; // 구버전(completed+duplicate) 호환
const isDone = (o) => ["completed", "duplicate"].includes(stat(o));

let queueItems = [];        // 업로드 화면에 보이는 항목 (미완료 작업 + 이번에 선택한 파일)
let itemById = new Map();

// ----- 해시 / ID -----
function cyrb53(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}
// 같은 파일을 다시 선택하면 같은 jobId가 나오도록 (경로+이름+크기+수정시간) 기반 결정적 ID
async function jobIdFor(file, relPath) {
  const key = `${relPath}|${file.name}|${file.size}|${file.lastModified}`;
  return "j" + (window.crypto && crypto.subtle ? await sha1Hex(key) : cyrb53(key));
}
// 내용 해시: 50MB 이하 = 전체 SHA-256(기존 fileHash와 동일 형식), 초과 = 크기+8곳 1MB 표본 해시("s:" 접두)
async function computeFileHash(file) {
  if (!(window.crypto && crypto.subtle)) return null;
  if (file.size <= FULL_HASH_LIMIT) return await sha256Hex(await file.arrayBuffer());
  const SLICE = 1024 * 1024, N = 8, parts = [];
  for (let i = 0; i < N; i++) {
    const start = Math.floor((file.size - SLICE) * i / (N - 1));
    parts.push(new Uint8Array(await file.slice(start, start + SLICE).arrayBuffer()));
  }
  const head = new TextEncoder().encode(`size:${file.size}`);
  const buf = new Uint8Array(head.length + parts.reduce((a, p) => a + p.length, 0));
  buf.set(head, 0); let off = head.length; parts.forEach(p => { buf.set(p, off); off += p.length; });
  return "s:" + await sha256Hex(buf);
}

// ----- Firestore 영속화 -----
function jobPatch(it) {
  return {
    uploadJobId: it.jobId, filename: it.name, fileHash: it.hash || null, status: it.status,
    cloudinaryPublicId: it.publicId || null, cloudinaryUrl: it.url || null, thumbnailUrl: it.thumb || null,
    cloudinaryResourceType: it.resourceType || null,
    error: it.error || null, duplicate: !!it.duplicate, dupKind: it.dupKind || null,
    size: it.size, lastModified: it.lastModified, relPath: it.relPath || "",
    keywords: it.keywords || [], updatedAt: serverTimestamp()
  };
}
function noteJob(it) { jobMap.set(it.jobId, { ...jobPatch(it), updatedAt: Date.now() }); }
async function persist(it) {
  noteJob(it);
  try { await setDoc(doc(db, "uploadJobs", it.jobId), jobPatch(it), { merge: true }); }
  catch (e) { persistErrors++; diag(`Firebase 작업 상태 저장 실패(${it.name}): ${e.message}`, true); }
}
async function persistMany(items, extra) {
  items.forEach(noteJob);
  for (let i = 0; i < items.length; i += 400) {
    try {
      const batch = writeBatch(db);
      items.slice(i, i + 400).forEach(it => batch.set(doc(db, "uploadJobs", it.jobId), { ...jobPatch(it), ...(extra || {}) }, { merge: true }));
      await batch.commit();
    } catch (e) { persistErrors++; diag(`Firebase 작업 일괄 저장 실패: ${e.message}`, true); }
  }
}

function itemFromJob(jobId, j) {
  return {
    jobId, name: j.filename || "(이름 없음)", size: j.size || 0, lastModified: j.lastModified || 0, relPath: j.relPath || "",
    file: null, handle: null,
    status: j.status === "uploading" ? "pending" : (stat(j) || "pending"), // 이전 세션에서 끊긴 uploading은 대기로 복구
    error: j.error || null, hash: j.fileHash || null, duplicate: !!j.duplicate, dupKind: j.dupKind || null,
    publicId: j.cloudinaryPublicId || null, url: j.cloudinaryUrl || null, thumb: j.thumbnailUrl || null,
    resourceType: j.cloudinaryResourceType || null, keywords: j.keywords || []
  };
}
function rebuildHashIndex() {
  hashIndex = new Map();
  videos.forEach(v => { if (v.fileHash) hashIndex.set(v.fileHash, { jobId: v.uploadJobId || v.id, publicId: v.cloudinaryPublicId, url: v.cloudinaryUrl, thumb: v.thumbnailUrl }); });
  jobMap.forEach((j, id) => {
    if (j.status === "completed" && j.fileHash && !j.duplicate && !hashIndex.has(j.fileHash))
      hashIndex.set(j.fileHash, { jobId: id, publicId: j.cloudinaryPublicId, url: j.cloudinaryUrl, thumb: j.thumbnailUrl });
  });
}
async function loadJobs() {
  try {
    const snap = await getDocs(collection(db, "uploadJobs"));
    jobMap = new Map(); snap.docs.forEach(d => { const j = d.data(); if (j.status === "uploading") j.status = "pending"; jobMap.set(d.id, j); }); // 끊긴 uploading은 대기로
    let open = 0;
    [...jobMap.entries()].sort((a, b) => String(a[1].relPath || "").localeCompare(String(b[1].relPath || "")) || String(a[1].filename).localeCompare(String(b[1].filename)))
      .forEach(([id, j]) => {
        if (!isDone(j) && !itemById.has(id)) { const it = itemFromJob(id, j); queueItems.push(it); itemById.set(id, it); open++; }
      });
    rebuildHashIndex();
    diag(`Firebase 업로드 작업 ${jobMap.size}개 로드 (미완료 ${open}개 복원)`);
    renderFileList();
  } catch (e) { diag("Firebase 업로드 작업 로드 실패: " + e.message, true); }
}

// ----- 파일 추가 -----
async function addFiles(entries) {
  await jobsReady;
  const vids = entries.filter(e => (e.file.type || "").startsWith("video/") || VIDEO_RE.test(e.file.name));
  const toCreate = [];
  let attached = 0, fresh = 0, known = 0;
  for (const e of vids) {
    const jobId = await jobIdFor(e.file, e.relPath || "");
    let it = itemById.get(jobId);
    if (it) {
      if (!it.file && !isDone(it)) { it.file = e.file; it.handle = e.handle || null; attached++; } else known++;
      continue;
    }
    const j = jobMap.get(jobId);
    if (j) {
      it = itemFromJob(jobId, j);
      if (!isDone(it)) { it.file = e.file; it.handle = e.handle || null; }
      known++;
    } else {
      it = { jobId, name: e.file.name, size: e.file.size, lastModified: e.file.lastModified, relPath: e.relPath || "",
        file: e.file, handle: e.handle || null, status: "pending", error: null, hash: null, duplicate: false,
        publicId: null, url: null, thumb: null, resourceType: null, keywords: [] };
      toCreate.push(it); fresh++;
    }
    queueItems.push(it); itemById.set(jobId, it);
  }
  renderFileList();
  if (toCreate.length) {
    for (let i = 0; i < toCreate.length; i += 400) {
      const chunk = toCreate.slice(i, i + 400);
      chunk.forEach(noteJob);
      try {
        const batch = writeBatch(db);
        chunk.forEach(it => batch.set(doc(db, "uploadJobs", it.jobId), { ...jobPatch(it), createdAt: serverTimestamp() }));
        await batch.commit();
      } catch (err) { persistErrors++; diag("Firebase 작업 생성 실패: " + err.message, true); }
    }
  }
  saveHandles(vids.map(e => e.handle ? e : null).filter(Boolean));
  diag(`파일 ${vids.length}개 추가 (신규 ${fresh}, 기존 작업 ${known}, 파일 재연결 ${attached}, 영상 아님 제외 ${entries.length - vids.length})`);
}

// ----- File System Access API + IndexedDB (지원 브라우저에서만; 실패하면 일반 선택창) -----
const hasFSA = "showOpenFilePicker" in window && "showDirectoryPicker" in window;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("editclip-upload", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("h");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(pairs) {
  const d = await idb();
  await new Promise((res, rej) => {
    const tx = d.transaction("h", "readwrite"), s = tx.objectStore("h");
    pairs.forEach(([k, v]) => s.put(v, k));
    tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const d = await idb();
  return await new Promise((res, rej) => { const r = d.transaction("h").objectStore("h").get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function saveHandles(entries) {
  if (!hasFSA || !entries.length) return;
  try {
    const pairs = [];
    for (const e of entries) pairs.push(["job:" + await jobIdFor(e.file, e.relPath || ""), e.handle]);
    await idbPut(pairs);
  } catch (e) { console.warn("[upload] 파일 핸들 저장 실패(자동 재개 불가, 다시 선택 필요):", e); }
}
async function saveDirHandle(dirHandle) {
  try { const cur = (await idbGet("dirs")) || []; await idbPut([["dirs", [...cur, dirHandle]]]); } catch (e) { console.warn("[upload] 폴더 핸들 저장 실패:", e); }
}
async function walkDir(dirHandle, prefix, out) {
  for await (const [name, h] of dirHandle.entries()) {
    if (h.kind === "directory") await walkDir(h, prefix + name + "/", out);
    else if (VIDEO_RE.test(name)) out.push({ file: await h.getFile(), relPath: prefix + name, handle: h });
  }
}
// 새로고침 후: 저장된 핸들로 파일 재연결 (사용자 클릭 필요, 권한 허용 창이 뜰 수 있음)
async function reconnectFiles() {
  if (!hasFSA) return alert("이 브라우저는 파일 자동 재연결을 지원하지 않습니다. 같은 파일/폴더를 다시 선택해 주세요.");
  const need = queueItems.filter(i => !i.file && !isDone(i));
  if (!need.length) return;
  let ok = 0;
  try {
    const dirs = (await idbGet("dirs")) || [];
    for (const d of dirs) { try { await d.requestPermission({ mode: "read" }); } catch (_) {} }
    for (const it of need) {
      try {
        const h = await idbGet("job:" + it.jobId);
        if (!h) continue;
        let perm = await h.queryPermission({ mode: "read" });
        if (perm !== "granted") { try { perm = await h.requestPermission({ mode: "read" }); } catch (_) {} }
        if (perm !== "granted") continue;
        const f = await h.getFile();
        if (await jobIdFor(f, it.relPath) !== it.jobId) continue; // 파일이 바뀌었으면 연결하지 않음
        it.file = f; it.handle = h; ok++;
      } catch (_) {}
    }
  } catch (e) { diag("파일 재연결 실패: " + e.message, true); }
  diag(`파일 재연결: ${ok}/${need.length}개`);
  toast(ok ? `${ok}개 파일을 다시 연결했습니다` : "연결하지 못했습니다. 파일/폴더를 다시 선택해 주세요.");
  renderFileList();
}

// ----- 화면 -----
function uiState(j, it) {
  const s = stat(j);
  if (s === "completed") return ["success", "완료"];
  if (s === "duplicate") return ["dup", j.dupKind === "name" ? "중복 · 건너뜀" : "중복"];
  if (s === "uploading") return ["uploading", "업로드 중"];
  if (s === "failed") return ["fail", it && !it.file ? "실패 · 재선택 필요" : "실패"];
  if (s === "paused") return ["paused", "일시정지"];
  return it && !it.file ? ["needfile", "대기 · 파일 재선택 필요"] : ["pending", "대기"];
}
const ST_NAMES = { completed: "완료", uploading: "업로드 중", pending: "대기", failed: "실패", paused: "일시정지", duplicate: "중복" };
let filterSt = "", renderTimer = null;
function renderFileList() { if (renderTimer) return; renderTimer = setTimeout(() => { renderTimer = null; renderFileListNow(); }, 120); }
function renderFileListNow() {
  // 집계는 Firestore uploadJobs(jobMap) 기준 → 모달을 닫거나 새로고침해도 유지
  const c = { total: jobMap.size, completed: 0, uploading: 0, pending: 0, failed: 0, paused: 0, duplicate: 0 };
  const rows = [];
  jobMap.forEach((j, id) => { const s = stat(j); if (s in c) c[s]++; if (!filterSt || filterSt === s) rows.push([id, j, s]); });
  const ord = { uploading: 0, failed: 1, pending: 2, paused: 2, completed: 3, duplicate: 3 };
  rows.sort((x, y) => ord[x[2]] - ord[y[2]]);
  const done = c.completed + c.duplicate, total = c.total, left = c.pending + c.paused;
  const pct = total ? done / total * 100 : 0, n = Math.round(pct / 10);
  const label = c.uploading > 0 || runState === "running" ? "업로드 중" : left ? (c.paused ? "업로드 일시정지" : "업로드 대기") : "업로드 완료";
  const sb = $("statusBar");
  sb.style.display = total ? "block" : "none";
  sb.classList.toggle("err", c.failed > 0);
  sb.textContent = `${label} · ${done.toLocaleString()}/${total.toLocaleString()}` + (c.failed ? ` · 실패 ${c.failed}` : "");
  $("countBox").innerHTML = [["", "전체", total], ...Object.entries(ST_NAMES).map(([k, nm]) => [k, nm, c[k]])].map(([k, nm, v]) =>
    `<span class="bundleChip" data-f="${k}" style="${filterSt === k ? "background:#1a1a1a;color:#fff;" : ""}">${nm} ${v.toLocaleString()}</span>`).join("");
  $("fileList").innerHTML = rows.slice(0, MAX_ROWS).map(([id, j, s]) => {
    const [cls, lb] = uiState(j, itemById.get(id));
    return `<div class="fileRow"><div class="nm">${esc(ellipsize(j.filename || "(이름 없음)"))}${s === "failed" && j.error ? `<div class="er">${esc(j.error)}</div>` : ""}</div>` +
      (s === "failed" ? `<button class="btn secondary" data-retry="${id}" style="padding:2px 8px;font-size:11px;margin-right:6px">재시도</button>` : "") + `<span class="st ${cls}">${lb}</span></div>`;
  }).join("") + (rows.length > MAX_ROWS ? `<div class="fileRow"><span>… 외 ${rows.length - MAX_ROWS}개 (상태 칩을 눌러 필터링)</span></div>` : "");
  $("progressBar").style.width = pct + "%";
  $("progressText").textContent = total ? `${"█".repeat(n)}${"░".repeat(10 - n)} ${pct.toFixed(1)}%` : "";
  const needfile = queueItems.filter(it => (it.status === "pending" || it.status === "paused") && !it.file).length;
  $("retryFailBtn").style.display = c.failed ? "block" : "none";
  $("reconnectBtn").style.display = needfile && hasFSA ? "block" : "none";
  let notice = "";
  if (needfile) notice += `새로고침/재접속 전에 끝나지 않은 파일 ${needfile}개는 브라우저가 파일 자체를 보관하지 않아 "다시 파일 선택 필요" 상태입니다. ` +
    (hasFSA ? `위의 "이전에 선택한 파일 다시 연결"을 누르거나, ` : `같은 파일/폴더를 `) + `다시 선택해 주세요. 이미 완료·중복 처리된 파일은 다시 업로드되지 않습니다.`;
  if (persistErrors) notice += `\n⚠ Firebase 상태 저장 실패 ${persistErrors}건 — 콘솔 확인`;
  $("uploadNotice").textContent = notice;
  $("pauseBtn").disabled = runState !== "running";
  $("resumeBtn").disabled = runState === "running" && c.paused === 0;
  $("stopAllBtn").disabled = runState !== "running" && runState !== "paused";
}

$("countBox").onclick = (e) => { const k = e.target.dataset.f; if (k === undefined) return; filterSt = k; renderFileListNow(); };

  it.status = "pending"; it.error = null; await persist(it); renderFileList(); begin();

// ----- Cloudinary 업로드 (unsigned, multipart: file + upload_preset) -----
async function uploadToCloudinary(file) {
  let lastErr;
  for (let attempt = 0; attempt <= MAX_AUTO_RETRY; attempt++) {
    const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), UPLOAD_TIMEOUT_MS);
    try {
      const fd = new FormData();
      fd.append("file", file, file.name);
      fd.append("upload_preset", UPLOAD_PRESET);
      diag(`POST ${CLD_ENDPOINT} ← ${file.name} (${(file.size / 1048576).toFixed(1)}MB) 시도 ${attempt + 1}`);
      const res = await fetch(CLD_ENDPOINT, { method: "POST", body: fd, signal: ctrl.signal });
      let data = null; try { data = await res.json(); } catch (_) {}
      if (!res.ok) {
        const err = new Error(`Cloudinary ${res.status}: ${data?.error?.message || res.statusText || "업로드 실패"}`);
        err.retryable = res.status === 429 || res.status >= 500; throw err;
      }
      if (!data || !data.secure_url || !data.public_id) throw new Error("Cloudinary 응답에 secure_url/public_id가 없습니다");
      return data;
    } catch (e) {
      if (e.name === "AbortError") { lastErr = new Error("업로드 시간 초과"); lastErr.retryable = true; }
      else if (e instanceof TypeError) { lastErr = new Error("네트워크 오류: " + e.message); lastErr.retryable = true; }
      else lastErr = e;
      console.error("[upload] 실패:", file.name, lastErr);
      if (!lastErr.retryable || attempt === MAX_AUTO_RETRY) break;
      await sleep(1500 * (attempt + 1) * (attempt + 1));
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

async function uploadAndSave(item) {
  if (!item.publicId) { // 이전에 Cloudinary는 성공했지만 저장만 실패한 경우 재업로드하지 않음
    const data = await uploadToCloudinary(item.file);
    item.publicId = data.public_id; item.url = data.secure_url; item.thumb = thumbUrl(data.public_id);
    item.resourceType = data.resource_type || null;
  }
  const kws = item.keywords && item.keywords.length ? item.keywords : snapshotKeywords;
  item.keywords = kws;
  const docData = {
    filename: item.name, cloudinaryPublicId: item.publicId, cloudinaryUrl: item.url, thumbnailUrl: item.thumb,
    cloudinaryResourceType: item.resourceType, keywords: kws, fileHash: item.hash || null,
    uploadJobId: item.jobId, createdAt: serverTimestamp()
  };
  try { await setDoc(doc(db, "videos", item.jobId), docData); } // 결정적 ID → 재시도해도 중복 문서 없음
  catch (e) { throw new Error("Firebase 영상 저장 실패(Cloudinary 업로드는 완료됨): " + e.message); }
  if (!videos.some(v => v.id === item.jobId)) videos.unshift({ id: item.jobId, ...docData, people: [], pairs: [], favorite: false });
  if (item.hash) hashIndex.set(item.hash, { jobId: item.jobId, publicId: item.publicId, url: item.url, thumb: item.thumb });
  return { jobId: item.jobId, publicId: item.publicId, url: item.url, thumb: item.thumb };
}

async function destroyOld(publicId) { // 서명 삭제: 브라우저에 API Key/Secret이 저장돼 있을 때만 동작(선택 사항)
  const key = localStorage.getItem("cld_api_key"), secret = localStorage.getItem("cld_api_secret");
  if (!key || !secret) return null; // API 키 없음: 입력창 없이 건너뜀 (기존 원본은 Cloudinary에 남음)
  const ts = Math.floor(Date.now() / 1000), fd = new FormData();
  const sig = await sha1Hex(`invalidate=true&public_id=${publicId}&timestamp=${ts}${secret}`);
  Object.entries({ public_id: publicId, invalidate: "true", timestamp: ts, api_key: key, signature: sig }).forEach(([k, v]) => fd.append(k, v));
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/destroy`, { method: "POST", body: fd });
  return (await r.json()).result === "ok";
}
// 순서: ① 새 파일 업로드 ② Firebase 갱신 ③ 기존 원본 삭제. ①②가 실패하면 기존 데이터는 그대로다.
async function overwriteAndSave(item) {
  const old = videos.find(v => v.id === item.targetId);
  if (!old) return uploadAndSave(item);
  if (!item.publicId) {
    const d = await uploadToCloudinary(item.file);
    item.publicId = d.public_id; item.url = d.secure_url; item.thumb = thumbUrl(d.public_id, d.version); item.resourceType = d.resource_type || null;
  }
  const patch = { cloudinaryPublicId: item.publicId, cloudinaryUrl: item.url, thumbnailUrl: item.thumb,
    cloudinaryResourceType: item.resourceType, fileHash: item.hash || null, uploadJobId: item.jobId }; // filename·검색어·인물·조합·favorite은 건드리지 않음
  try { await updateDoc(doc(db, "videos", old.id), { ...patch, updatedAt: serverTimestamp() }); }
  catch (e) { throw new Error("Firebase 영상 갱신 실패(기존 데이터는 유지됨): " + e.message); }
  const oldPid = old.cloudinaryPublicId, oldHash = old.fileHash;
  Object.assign(old, patch);
  if (oldHash) hashIndex.delete(oldHash);
  if (item.hash) hashIndex.set(item.hash, { jobId: old.id, publicId: item.publicId, url: item.url, thumb: item.thumb });
  if (oldPid && oldPid !== item.publicId) { // 프리셋이 같은 public_id로 덮어쓴 경우엔 삭제하지 않음
    let ok = false; try { ok = await destroyOld(oldPid); } catch (_) {}
    if (ok === false) toast(`기존 원본 삭제 실패(Cloudinary에 남아 있음): ${item.name}`);
  }
  return { jobId: old.id, publicId: item.publicId, url: item.url, thumb: item.thumb };
}

let gridTimer = null;
function scheduleGridRender() { if (gridTimer) return; gridTimer = setTimeout(() => { gridTimer = null; render(); }, 3000); }

async function processItem(item) {
  try {
    item.hash = item.hash || await computeFileHash(item.file);
    if (!item.hash && !processItem.warned) { processItem.warned = true; diag("이 환경은 crypto.subtle(HTTPS 필요)이 없어 해시 중복 검사를 건너뜁니다", true); }
    let existing = null, waitFor = null, p = null;
    if (item.hash) {
      existing = hashIndex.get(item.hash);
      if (existing && existing.jobId === item.jobId) existing = null;
      if (!existing) waitFor = inflight.get(item.hash);
    }
    if (!existing && waitFor) { try { existing = await waitFor; } catch (_) { existing = null; } }
    if (!existing) {
      p = (item.action === "overwrite" ? overwriteAndSave : uploadAndSave)(item);                       // 검사~등록이 동기 구간이라 같은 hash 동시 업로드 방지
      if (item.hash) inflight.set(item.hash, p);
      try { await p; } finally { if (item.hash && inflight.get(item.hash) === p) inflight.delete(item.hash); }
      item.duplicate = false;
    } else {
      item.duplicate = true; item.dupKind = "hash"; item.publicId = existing.publicId; item.url = existing.url; item.thumb = existing.thumb;
      diag(`이미 등록됨(해시 일치), 업로드 생략: ${item.name}`);
    }
    item.status = item.duplicate ? "duplicate" : "completed"; item.error = null;
  } catch (e) {
    item.status = "failed"; item.error = e.message || String(e);
    diag(`실패: ${item.name} — ${item.error}`, true);
  }
  await persist(item);
  renderFileList(); scheduleGridRender();
}

// ----- worker queue -----
function pickNext() {
  for (const it of queueItems) if (it.status === "pending" && it.file && it.checked) return it; // checked = 파일명 중복 확인 완료
  return null;
}
async function worker() {
  try {
    while (runState === "running") {
      const item = pickNext();
      if (!item) break;
      item.status = "uploading"; item.error = null;
      persist(item);            // 상태 저장 (Firestore SDK가 순서 보장)
      renderFileList();
      await processItem(item);  // 내부에서 예외를 처리하므로 큐가 중단되지 않음
    }
  } catch (e) { diag("worker 오류: " + (e.message || e), true); }
  finally {
    activeWorkers--;
    if (activeWorkers === 0) {
      if (runState === "running") runState = "idle";
      diag(runState === "idle" ? "대기 중인 업로드가 모두 처리되었습니다" : `큐 정지 (${runState})`);
      render(); renderFileList();
    }
  }
}
function startWorkers() {
  while (activeWorkers < CONCURRENCY && runState === "running" && pickNext()) {
    activeWorkers++; worker();   // worker는 첫 await 전에 항목을 uploading으로 바꾼다
  }
  renderFileList();
}

function askDups(list) {
  return new Promise(res => {
    const ov = $("dupOverlay"), body = $("dupBody");
    const fin = (ok) => { ov.classList.remove("show"); if (!ok) list.forEach(c => { c.it.action = null; }); res(ok); };
    const btn = (k, t, x = "") => `<button class="btn ${x}" data-k="${k}" style="padding:10px 14px">${t}</button>`;
    const rows = () => {
      body.innerHTML = list.map((c, i) => `<div class="fileRow" style="flex-wrap:wrap;gap:6px"><div class="nm" style="flex-basis:100%">기존: ${esc(c.old.filename)}<br>새 파일: ${esc((c.it.relPath || "") + c.it.name)} · ${(c.it.size / 1048576).toFixed(1)}MB</div>` +
        ["overwrite", "skip"].map(a => `<button class="btn ${c.it.action === a ? "" : "secondary"}" data-i="${i}" data-a="${a}" style="padding:6px 12px;font-size:12px">${a === "overwrite" ? "덮어쓰기" : "건너뛰기"}</button>`).join("") + `</div>`).join("") +
        `<div style="display:flex;gap:6px;margin-top:10px">${list.length > 1 ? `<button class="btn" data-k="ok" style="flex:1" ${list.every(c => c.it.action) ? "" : "disabled"}>확인</button>` : ""}${btn("cancel", "취소", "secondary")}</div>`;
    };
    $("dupTitle").textContent = list.length > 1 ? `중복 파일 ${list.length}개 발견` : "동일한 파일명이 이미 존재합니다.";
    if (list.length > 1) body.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px">${btn("ow", "전체 덮어쓰기")}${btn("sk", "전체 건너뛰기")}${btn("pick", "파일별 선택", "secondary")}${btn("cancel", "취소", "secondary")}</div>`;
    else rows();
    body.onclick = (e) => {
      const b = e.target.closest("button"); if (!b || b.disabled) return;
      const { k, i, a } = b.dataset;
      if (a) { list[i].it.action = a; return list.length === 1 ? fin(true) : rows(); }
      if (k === "ow" || k === "sk") { list.forEach(c => { c.it.action = k === "ow" ? "overwrite" : "skip"; }); fin(true); }
      else if (k === "pick") rows();
      else if (k === "ok") fin(true);
      else if (k === "cancel") fin(false);
    };
    ov.classList.add("show"); // 기본 선택값 없음: 사용자가 고를 때까지 action은 null
  });
}
// 등록된 영상과 filename이 같으면 사용자에게 묻는다. 내용(hash)까지 같으면 묻지 않고 hash 중복으로 처리된다.
async function resolveDups() {
  const byName = new Map(videos.map(v => [v.filename, v])), list = [];
  for (const it of queueItems) {
    if (it.status !== "pending" || !it.file || it.action) continue;
    const old = byName.get(it.name);
    if (!old || old.id === it.jobId) continue;
    it.hash = it.hash || await computeFileHash(it.file);
    if (it.hash && old.fileHash === it.hash) continue;
    it.targetId = old.id; list.push({ it, old });
  }
  if (list.length && !(await askDups(list))) return false;
  const sk = list.map(c => c.it).filter(i => i.action === "skip");
  sk.forEach(i => { i.status = "duplicate"; i.duplicate = true; i.dupKind = "name"; i.error = null; });
  if (sk.length) await persistMany(sk);   // 건너뛴 파일: 업로드 없이 중복 상태로 기록
  return true;
}
let askBusy = false;
async function begin() {
  if (askBusy) return;
  askBusy = true;
  try {
    snapshotKeywords = tokenize($("uploadKwInput").value);
    await videosReady;
    if (!(await resolveDups())) return;
    queueItems.forEach(i => { if (i.status === "pending") i.checked = true; });
  } finally { askBusy = false; }
  renderFileList();
  if (pickNext()) { runState = "running"; startWorkers(); }
}

$("startUploadBtn").onclick = () => {
  diag("업로드 시작 버튼 클릭");
  const ready = queueItems.filter(i => i.status === "pending" && i.file).length;
  if (!ready) {
    const paused = queueItems.filter(i => i.status === "paused" && i.file).length;
    const need = queueItems.filter(i => !i.file && !isDone(i)).length;
    return alert(paused ? "중지된 파일이 있습니다. [재개]를 눌러 주세요." : need ? "업로드할 파일이 브라우저에 없습니다. 파일을 다시 선택해 주세요." : "업로드할 파일이 없습니다");
  }
  begin();
};
$("pauseBtn").onclick = () => {
  if (runState !== "running") return;
  runState = "paused"; diag("일시정지: 진행 중인 요청이 끝나면 멈춥니다"); renderFileList();
};
$("resumeBtn").onclick = async () => {
  const paused = queueItems.filter(i => i.status === "paused");
  paused.forEach(i => { i.status = "pending"; });
  if (paused.length) await persistMany(paused);
  diag("재개"); await begin();
};
$("stopAllBtn").onclick = async () => {
  if (runState === "idle") return;
  runState = "stopped";
  const pend = queueItems.filter(i => i.status === "pending");
  pend.forEach(i => { i.status = "paused"; });
  await persistMany(pend);
  diag(`전체 중지: 대기 ${pend.length}개를 중지됨(paused)으로 저장`); renderFileList();
};
$("retryFailBtn").onclick = async () => {
  const targets = queueItems.filter(i => i.status === "failed" && i.file);
  if (!targets.length) return alert("실패한 파일을 다시 업로드하려면 해당 파일을 다시 선택해야 합니다.");
  targets.forEach(i => { i.status = "pending"; i.error = null; });
  await persistMany(targets);
  await begin();
};
window.addEventListener("beforeunload", (e) => {
  if (activeWorkers > 0) { e.preventDefault(); e.returnValue = "업로드가 진행 중입니다. 현재 진행 상황은 저장됩니다."; return e.returnValue; }
});

// ---------- 검색어 적용 ----------
$("applyKwBtn").onclick = () => {
  if (!selected.size) return alert("영상을 선택하세요");
  $("kwTargetCount").textContent = selected.size;
  $("kwInput").value = "";
  renderBundles();
  $("kwOverlay").classList.add("show");
};
$("kwClose").onclick = () => $("kwOverlay").classList.remove("show");

function renderBundles() {
  $("bundleList").innerHTML = bundles.map(b =>
    `<span class="bundleChip" data-id="${b.id}">${b.name}</span>`
  ).join("");
  [...document.querySelectorAll(".bundleChip")].forEach(chip => {
    chip.onclick = () => {
      const b = bundles.find(x => x.id === chip.dataset.id);
      $("kwInput").value = (b.keywords || []).join(", ");
    };
  });
}

$("saveBundleBtn").onclick = async () => {
  const name = $("bundleNameInput").value.trim();
  const keywords = tokenize($("kwInput").value);
  if (!name || !keywords.length) return alert("이름과 검색어를 입력하세요");
  const ref = await addDoc(collection(db, "bundles"), { name, keywords });
  bundles.push({ id: ref.id, name, keywords });
  $("bundleNameInput").value = "";
  renderBundles();
};

$("kwApplyBtn").onclick = async () => {
  const field = document.querySelector('input[name="kwField"]:checked').value;
  const mode = document.querySelector('input[name="kwMode"]:checked').value;
  const raw = field === "pairs"
    ? $("kwInput").value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean)
    : tokenize($("kwInput").value);
  if (mode !== "remove" && !raw.length) return alert("값을 입력하세요");
  const targets = [];
  selected.forEach(id => {
    const v = videos.find(x => x.id === id);
    if (!v) return;
    const cur = new Set(v[field] || []);
    if (mode === "add") raw.forEach(k => cur.add(k));
    else if (mode === "overwrite") { cur.clear(); raw.forEach(k => cur.add(k)); }
    else if (mode === "remove") raw.forEach(k => cur.delete(k));
    targets.push({ v, arr: [...cur] });
  });
  const btn = $("kwApplyBtn"); btn.disabled = true;
  try {
    // Firestore 배치는 500건 제한 → 400건씩 나눠 커밋, 저장 성공한 것만 메모리에 반영
    for (let i = 0; i < targets.length; i += 400) {
      const chunk = targets.slice(i, i + 400);
      const batch = writeBatch(db);
      chunk.forEach(({ v, arr }) => batch.update(doc(db, "videos", v.id), { [field]: arr, updatedAt: serverTimestamp() }));
      await batch.commit();
      chunk.forEach(({ v, arr }) => { v[field] = arr; });
    }
  } catch (e) {
    alert("저장 중 오류가 발생했습니다. 일부만 저장됐을 수 있습니다.\n" + e.message);
    render(); btn.disabled = false; return;
  }
  btn.disabled = false;
  $("kwOverlay").classList.remove("show");
  selected.clear(); resetRange();
  // 「검색어 없는 것만」 ON이면 선택 모드를 유지해 바로 다음 묶음을 이어서 처리
  if (!(noKwOnly && field === "keywords")) selectMode = false;
  updateSelBar(); render(); // 저장된 영상은 필터에서 즉시 사라짐
  toast(`${targets.length}개 영상에 적용했습니다`);
};

// ---------- init ----------
jobsReady = loadJobs();
const videosReady = loadVideos().then(() => rebuildHashIndex());
loadBundles();
</script>
</body>
</html>
